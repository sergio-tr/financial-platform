schemaVersion: 1
registry: SER-106
status: PLANNED
note: >-
  Normative SecretVault verification identities (P0-R43 R43-30). Routed outside
  the SER-107 eighteen-entry catalog until P0-R37 merges registries. No
  IMPLEMENTED evidence in Phase 0 documentation-only cut.
items:
  - id: TEST-SEC-VAULT-CIPHERTEXT-TAMPER
    assertion: >-
      Tampering with ciphertext, AAD binding fields, wrapped DEK, or GCM tags
      fails closed with SECRET_TAG_MISMATCH or SECRET_AAD_MISMATCH and emits no
      plaintext.
    requirementRefs: [REQ-CON-002, NFR-SEC-003, NFR-SEC-005]
  - id: TEST-SEC-VAULT-WRONG-KEK
    assertion: >-
      Decrypt with a non-active or incorrect KEK version fails without revealing
      which byte offset was invalid beyond safe error classes.
    requirementRefs: [REQ-CON-002, NFR-SEC-003]
  - id: TEST-SEC-VAULT-FORMAT-UNSUPPORTED
    assertion: >-
      Unknown cryptoFormatVersion returns SECRET_CRYPTO_FORMAT_UNSUPPORTED and
      never attempts decrypt.
    requirementRefs: [REQ-CON-002, NFR-SEC-003]
  - id: TEST-SEC-VAULT-GATEWAY-NO-KEK
    assertion: >-
      GATEWAY role cannot read the mounted SecretVault KEK file or obtain lease
      decrypt capability.
    requirementRefs: [REQ-CON-002, NFR-SEC-005]
  - id: TEST-SEC-VAULT-NO-PLAINTEXT-SINKS
    assertion: >-
      Resolved secrets never appear in logs, RabbitMQ, outbox, replay buffers,
      Temporal payloads, or telemetry exports.
    requirementRefs: [NFR-SEC-003, NFR-PRIV-001]
  - id: TEST-SEC-VAULT-STORE-IDEMPOTENT
    assertion: >-
      Repeated STORE with the same idempotency key does not create a second
      active version or duplicate ciphertext rows.
    requirementRefs: [REQ-CON-002, NFR-RELIABILITY-001]
  - id: TEST-SEC-VAULT-LEASE-BOUNDS
    assertion: >-
      Credential leases expire within 60 seconds, bind workspace and slot
      dimensions, and cannot be renewed into cross-workspace scope.
    requirementRefs: [REQ-CON-002, NFR-SEC-003]
  - id: TEST-SEC-VAULT-KEK-ROTATION-REWRAP
    assertion: >-
      KEK rotation rewraps all active DEKs, verifies decrypt, and retires the
      prior KEK version without plaintext export.
    requirementRefs: [REQ-CON-002, NFR-REC-003]
  - id: TEST-SEC-VAULT-KEK-COMPROMISE-EXTERNAL-ROTATION
    assertion: >-
      Declared KEK compromise forces upstream provider credential rotation;
      rewrap alone does not clear COMPROMISED state.
    requirementRefs: [REQ-CON-002, NFR-SEC-003, NFR-REC-003]
  - id: TEST-SEC-VAULT-MISSING-KEK-STARTUP
    assertion: >-
      Missing or unreadable KEK at startup sets SecretVault to LOCKED and
      rejects decrypt and lease issuance.
    requirementRefs: [REQ-CON-002, NFR-SEC-003]
  - id: TEST-SEC-VAULT-RESTORE-WITHOUT-KEK
    assertion: >-
      Restore from backup without local KEK leaves secrets in
      KEY_UNAVAILABLE_REAUTH_REQUIRED until human reauth/rotation path completes.
    requirementRefs: [NFR-REC-003, REQ-WORKSPACE-005]
  - id: TEST-SEC-VAULT-BROWSER-PERSISTENCE-CLEAN
    assertion: >-
      Client surfaces do not persist resolved secrets in localStorage,
      sessionStorage, or service-worker caches after navigation teardown.
    requirementRefs: [NFR-SEC-005, NFR-PRIV-001]