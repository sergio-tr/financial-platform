    objectKind: TABLE
    securityClass: SYSTEM_INTERNAL
    ownershipColumns:
      workspaceId: null
      userId: null
      notes: >
        Spring Session JDBC row; PRINCIPAL_NAME holds authenticated principal key.
        No workspace tenancy column on the physical table (P0-R21 R21-02).
    rls:
      applicable: false
      enabled: false
      force: false
      notApplicableReason: >
        Infrastructure schema platform_session; tenant isolation enforced by application
        session coordinator and role grants, not row policies (P0-R41 infrastructure carve-out).
    rolePrivileges:
      - role: sergiotr_gateway
        operations: [SELECT, INSERT, UPDATE, DELETE]
        notes: GATEWAY owns SessionSecurityCoordinator persistence path.
