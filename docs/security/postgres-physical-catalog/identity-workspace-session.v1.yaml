        operations: [NONE]
        notes: Workers do not touch live session store (P0-R23 privilege separation).
      - role: sergiotr_migrator
        operations: [SELECT, INSERT, UPDATE, DELETE]
        notes: DDL/DML for Liquibase only; not a runtime role.
      - role: sergiotr_backup
        operations: [SELECT]
      - role: sergiotr_db_owner
        operations: [SELECT, INSERT, UPDATE, DELETE]
        notes: Break-glass owner; never used by application runtime.
