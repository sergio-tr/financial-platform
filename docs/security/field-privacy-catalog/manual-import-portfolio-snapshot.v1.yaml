catalogVersion: 1
sliceId: SER-161-finance-field-privacy-v1
parentTicket: SER-109
statusNote: >
  First SER-109 field-level Finance slice (SER-161): manual import, provider source metadata,
  account/portfolio ownership, transactions, positions/lots, snapshots, performance/X-Ray derived outputs.
  Cross-refs SER-160 sink vocabulary and R46 class policy. Does not complete SER-109 globally.
  No physical PostgreSQL table names invented; no runtime egress enforcement.
classPolicyCrossRef: docs/security/data-classification.yaml
retentionRegistryCrossRef: docs/security/retention-policies.yaml
crossCatalogRefs:
  - docs/security/field-privacy-catalog/identity-workspace-session-mfa.v1.yaml
authorityRefs:
  - id: P0-R46
    source: data classification and sink deny-by-default
  - id: P0-R47
    source: retention cross-ref only; durable importer retention pending SER-110 ratification
  - id: P0-R24
    source: deterministic financial calculation authority
  - id: P0-R25
    source: workspace-scoped portfolio ownership
  - id: SER-109
    source: parent field inventory ticket
  - id: SER-60
    source: manual/synthetic import connector scope (Linear)
  - id: SER-62
    source: import file handling acceptance
  - id: SER-63
    source: portfolio bounded context
  - id: SER-71
    source: snapshot immutability
  - id: SER-81
    source: provider sync and quarantine semantics
  - id: SER-84
    source: account structure
  - id: SER-94
    source: portfolio pack authority (Linear SER-94)
  - id: SER-160
    source: canonical sink vocabulary alignment
canonicalSinkVocabulary:
  - secretvault_protected_ipc_scoped_lease
