  - rabbitmq
  - outbox
  - replay_buffer
  - temporal
  - ai_inference
  - rag_index
  - telemetry
  - git_repository
  - ci_artifact
  - slack
  - linear
  - figma
  - external_export
  - cloud_saas
  - collaboration_tool
blockerMatrix:
  - gapId: G-FIN-001
    scope: finance.portfolio.physical_tables
    status: OPEN
    reason: Physical PostgreSQL names for portfolio/account/transaction tables not ratified (SER-103)
  - gapId: G-FIN-002
    scope: finance.import.quarantine_retention
    status: OPEN
    reason: Importer quarantine retention duration pending SER-110 + human ratification
  - gapId: G-COV-FIELD-001
    scope: finance.connectors.portfolio
    status: PARTIAL
    reason: SER-161 covers first financial vertical; connectors AI remainder open in SER-109
  - gapId: G-COV-FIELD-002
    scope: global.class_owners
    status: OPEN
    reason: data-classification.yaml class owners still PENDING (SER-109)
