schemaVersion: 1
status: LOCKED
sourcePack: P0-R43
owner: SER-106

cryptoFormatVersions:
  - id: sergiotr-secret-envelope-v1
    status: ACTIVE
    algorithms:
      secretPayload: AES-256-GCM
      dekWrap: AES-256-GCM
    sizes:
      dekBits: 256
      kekBits: 256
      contentNonceBits: 96
      contentTagBits: 128
      wrapNonceBits: 96
      wrapTagBits: 128
    randomSource: CSPRNG
    disallowBusinessIdsAsKeyMaterial: true

secretVersionStatus:
  - ACTIVE
  - ROTATING
  - REVOKED
  - KEY_UNAVAILABLE_REAUTH_REQUIRED

kekVersionStatus:
  - ACTIVE
  - RETIRING
  - RETIRED
  - COMPROMISED

hostKekPolicy:
  defaultKekLossMode: REAUTH_ON_KEK_LOSS
  kekPathExample: /run/secrets/sergiotr_secretvault_kek
  parentDirMode: "0700"
  kekFileMode: "0600"
  readableByRoles:
    - sergiotr_worker
  forbiddenLocations:
    - git
    - postgresql
    - environment_variables
    - cli_arguments
    - container_image_layers

leasePolicy:
  maxGrantSeconds: 60
  executionBound: true
  crossWorkspaceLeases: false

independentKeyPurposes:
  - secretvault_kek
  - fingerprint_hmac
  - backup_repository
  - tls_ca
  - session_mfa
  - recovery_control_ledger_signing

aadBindingFields:
  - cryptoFormatVersion
  - secretRef
  - secretVersionId
  - workspaceId
  - ownerBinding
  - secretSlotId

decryptErrors:
  SECRET_CRYPTO_FORMAT_UNSUPPORTED: Unknown or retired cryptoFormatVersion
  SECRET_KEK_UNAVAILABLE: Active KEK missing or unreadable
  SECRET_AAD_MISMATCH: Authenticated additional data does not match record binding
  SECRET_TAG_MISMATCH: GCM authentication failed