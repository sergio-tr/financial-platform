name: v0-engineering-substrate

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/app/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Backend verify
        run: ./mvnw -B verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.7.0 --activate
      - name: Install and build
        run: |
          pnpm install
          pnpm run build
      - name: Unit tests
        run: pnpm run test
      - name: Dev server HTTP smoke
        env:
          NG_CLI_ANALYTICS: "false"
        run: |
          pnpm --dir frontend/app start &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4200/ >/dev/null; then
              echo "V0_FRONTEND_DEV_SERVER_SMOKE_PASS"
              exit 0
            fi
            sleep 1
          done
          echo "V0_FRONTEND_DEV_SERVER_SMOKE_FAIL: no HTTP 200 from dev server" >&2
          exit 1