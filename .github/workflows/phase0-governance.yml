name: phase0-governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 jsonschema==4.25.1
      - name: Traceability foundation (SER-97 Stage A)
        run: python scripts/governance/validate-traceability.py --profile foundation
      - name: SER-101 requirement invariants
        run: python scripts/governance/validate-ser-101-requirements.py
      - name: Traceability fixtures
        run: python scripts/governance/run-traceability-fixtures.py
      - name: DEV synthetic V1 gate (SER-143)
        run: python scripts/governance/validate-dev-synthetic-v1-gate.py
      - name: Generated trace matrix clean
        run: python scripts/governance/generate-trace-matrix.py --check-clean
      - name: PR/branch policy (pull_request)
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
          python scripts/governance/validate-pr-trace.py \
            --branch "$PR_BRANCH" \
            --pr-body /tmp/pr-body.md \
            --pr-title "$PR_TITLE" \
            --pr-number "$PR_NUMBER"
      - name: PR diff impact (SER-97 Stage B)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" "$PR_HEAD_SHA"
          git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" > /tmp/changed-files.txt
          python scripts/governance/validate-pr-diff-impact.py --changed-files /tmp/changed-files.txt
      - name: TaskPacket example schema
        run: python scripts/governance/validate-task-packet.py --skip-hash docs/governance/task-packet.example.yaml
      - name: SER-97 Stage A TaskPacket
        run: python scripts/governance/validate-task-packet.py docs/governance/packets/SER-97-stage-a.task-packet.yaml
      - name: SER-97 Stage B TaskPacket
        run: python scripts/governance/validate-task-packet.py docs/governance/packets/SER-97-stage-b.task-packet.yaml
      - name: SER-140 V0 bootstrap TaskPacket
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -q '^docs/governance/packets/SER-140-v0-bootstrap-01.task-packet.yaml\|^backend/\|^frontend/app/'; then
            python scripts/governance/validate-task-packet.py docs/governance/packets/SER-140-v0-bootstrap-01.task-packet.yaml
          else
            echo "SKIP SER-140 packet (no bootstrap paths in PR)"
          fi
      - name: SER-141 V0 bootstrap fixes TaskPacket
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -q '^docs/governance/packets/SER-141-v0-bootstrap-02.task-packet.yaml'; then
            python scripts/governance/validate-task-packet.py docs/governance/packets/SER-141-v0-bootstrap-02.task-packet.yaml
          else
            echo "SKIP SER-141 packet (path not in PR)"
          fi
      - name: SER-142 V0 dev-server smoke cleanup TaskPacket
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -q '^docs/governance/packets/SER-142-v0-bootstrap-03.task-packet.yaml'; then
            python scripts/governance/validate-task-packet.py docs/governance/packets/SER-142-v0-bootstrap-03.task-packet.yaml
          else
            echo "SKIP SER-142 packet (path not in PR)"
          fi
      - name: SER-143 DEV synthetic V1 gate TaskPacket
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -q '^docs/governance/packets/SER-143-dev-gate-01.task-packet.yaml'; then
            python scripts/governance/validate-task-packet.py docs/governance/packets/SER-143-dev-gate-01.task-packet.yaml
          else
            echo "SKIP SER-143 packet (path not in PR)"
          fi
      - name: Fixture catalog schema
        run: |
          python - <<'PY'
          import json, yaml
          from jsonschema import Draft202012Validator
          schema=json.load(open("test/fixtures/catalog.schema.json"))
          data=yaml.safe_load(open("test/fixtures/catalog.yaml"))
          errors=list(Draft202012Validator(schema).iter_errors(data))
          assert not errors, [e.message for e in errors]
          print("FIXTURE_CATALOG_PASS")
          PY
      - name: Candidate-state example
        run: python scripts/acceptance/validate-candidate-state.py docs/delivery/candidate-state.example.yaml
