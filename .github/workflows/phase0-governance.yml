name: phase0-governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 jsonschema==4.25.1
      - name: Traceability foundation (SER-97 Stage A)
        run: python scripts/governance/validate-traceability.py --profile foundation
      - name: SER-101 requirement invariants
        run: python scripts/governance/validate-ser-101-requirements.py
      - name: Traceability fixtures
        run: python scripts/governance/run-traceability-fixtures.py
      - name: Generated trace matrix clean
        run: python scripts/governance/generate-trace-matrix.py --check-clean
      - name: PR/branch policy (pull_request)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
          python scripts/governance/validate-pr-trace.py \
            --branch "${{ github.head_ref }}" \
            --pr-body /tmp/pr-body.md \
            --pr-title "$PR_TITLE" \
            --pr-number "$PR_NUMBER"
      - name: TaskPacket example schema
        run: python scripts/governance/validate-task-packet.py --skip-hash docs/governance/task-packet.example.yaml
      - name: SER-97 Stage A TaskPacket
        run: python scripts/governance/validate-task-packet.py docs/governance/packets/SER-97-stage-a.task-packet.yaml
      - name: Fixture catalog schema
        run: |
          python - <<'PY'
          import json, yaml
          from jsonschema import Draft202012Validator
          schema=json.load(open("test/fixtures/catalog.schema.json"))
          data=yaml.safe_load(open("test/fixtures/catalog.yaml"))
          errors=list(Draft202012Validator(schema).iter_errors(data))
          assert not errors, [e.message for e in errors]
          print("FIXTURE_CATALOG_PASS")
          PY
      - name: Candidate-state example
        run: python scripts/acceptance/validate-candidate-state.py docs/delivery/candidate-state.example.yaml
